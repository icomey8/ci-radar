services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: local
      POSTGRES_DB: ci_radar
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ci_radar"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: